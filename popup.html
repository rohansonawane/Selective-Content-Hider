<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selective Content Hider</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="22" height="22">
          <defs>
            <linearGradient id="g" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8b5cf6"/>
              <stop offset="1" stop-color="#2dd4bf"/>
            </linearGradient>
          </defs>
          <path fill="url(#g)" fill-rule="evenodd" d="M16 3.2 27 9.2v13.6L16 28.8 5 22.8V9.2L16 3.2Zm0 5.2 7.4 4.2v8.4L16 25.2l-7.4-4.2v-8.4L16 8.4Z"/>
        </svg>
      </span>
      <div class="brand-copy">
        <h1>Content Hider</h1>
        <p class="site" id="siteLabel">This page</p>
      </div>
    </div>
    <span class="status" id="statusChip">Idle</span>
  </header>

  <button type="button" class="cta" id="toggle">
    <span class="cta-kicker" id="toggleKicker">Selection mode</span>
    <span class="cta-title" id="toggleTitle">Start hiding</span>
    <span class="cta-copy" id="toggleCopy">Click any section on the page</span>
  </button>

  <p class="notice hidden" id="notice"></p>
  <p class="notice notice-pause hidden" id="pauseNotice">Hides are paused. Saved rules stay; the page is shown in full.</p>

  <section class="panel">
    <div class="panel-head">
      <div>
        <h2>This site</h2>
        <p class="muted" id="countLabel">Nothing hidden yet</p>
      </div>
      <div class="panel-actions">
        <button type="button" class="text-btn" id="pause" disabled>Pause</button>
        <button type="button" class="text-btn" id="reset" disabled>Restore all</button>
      </div>
    </div>
    <div class="list" id="hiddenList"></div>
  </section>

  <details class="panel settings">
    <summary>Settings</summary>
    <label class="setting">
      <span>
        <strong>Hover highlight</strong>
        <small>Outline the section under your cursor</small>
      </span>
      <input type="checkbox" id="highlightToggle" checked>
    </label>
    <label class="setting">
      <span>
        <strong>Remember after reload</strong>
        <small>Keep items hidden the next time you visit</small>
      </span>
      <input type="checkbox" id="persistToggle" checked>
    </label>
    <label class="setting">
      <span>
        <strong>Hide similar items</strong>
        <small>Ask before hiding matching sections together</small>
      </span>
      <input type="checkbox" id="smartSelectToggle">
    </label>
    <label class="setting">
      <span>
        <strong>Restore stubs</strong>
        <small>Leave a restore bar where a section was</small>
      </span>
      <input type="checkbox" id="stubsToggle" checked>
    </label>
  </details>

  <footer class="footer">
    <span id="shortcutToggle">Ctrl+Shift+H</span>
    <button type="button" class="text-btn" id="openOptions">All sites</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
